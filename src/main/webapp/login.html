<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login - Biblioteca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Seu CSS continua igual */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f6f8; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
    .login-container h2 { text-align: center; margin-bottom: 24px; color: #2c3e50; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #34495e; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ccc; }
    .btn-login { background-color: #2980b9; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease; }
    .btn-login:hover { background-color: #1e6aa8; }
    .footer-text { margin-top: 20px; text-align: center; font-size: 0.9rem; color: #7f8c8d; }
    .footer-text a { color: #2980b9; text-decoration: none; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Biblioteca Digital</h2>
  <form action="LoginServlet" method="post">
    <div class="form-group">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
    </div>
    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
    </div>
    <button type="submit" class="btn-login">Entrar</button>
  </form>
  <p class="footer-text">Ainda não tem conta? <a href="register.jsp">Cadastre-se</a></p>
</div>

</body>
</html>
